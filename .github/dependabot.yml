# Dependency, base-image, action and provider updates arrive as pull requests, so they pass
# the same CI gates (tests, image scan, Terraform validation and policy checks) as any change.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: terraform
    directories:
      - "/infra/envs/shared-services"
      - "/infra/envs/staging"
      - "/infra/envs/production"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
